services:
  - type: web
    name: punjabi-royal-suits
    env: node
    region: singapore
    plan: free
    buildCommand: npm install && npm run build && npx prisma db push && npm run seed
    startCommand: npm run start
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 5000
      - key: JWT_SECRET
        generateValue: true
      - key: DATABASE_URL
        value: "file:./dev.db"
